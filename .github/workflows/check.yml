name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 内容检查（禁用表述、链接、锚点、清单、日期）
        run: python3 scripts/check.py --strict
      - name: 单元测试
        run: python3 -m unittest discover -s tests -v
      - name: 复核期限
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check.py --strict --max-age-days 45
      - name: 外部链接（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check.py --online
